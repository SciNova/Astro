[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-astro"
version = "1.11"
description = "Astronomy utilities — celestial location, sun/moon position calculations"
readme = { text = "Astronomy utilities — celestial location, sun/moon position calculations.", content-type = "text/plain" }
license = "GPL-3.0-or-later"
requires-python = ">=3.8"
dependencies = [
    "python-date",
]

[tool.setuptools]
packages = ["astro"]

[tool.setuptools.package-dir]
astro = "."
